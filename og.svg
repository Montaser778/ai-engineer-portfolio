<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#22d3c5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3c5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- particle motif, flat -->
  <g opacity="0.5" stroke="#8892a6" stroke-width="1">
    <line x1="880" y1="120" x2="980" y2="90"/>
    <line x1="980" y1="90" x2="1060" y2="160"/>
    <line x1="1060" y1="160" x2="960" y2="200"/>
    <line x1="960" y1="200" x2="880" y2="120"/>
    <line x1="980" y1="90" x2="1100" y2="90"/>
    <line x1="1060" y1="160" x2="1120" y2="220"/>
  </g>
  <g fill="#7c5cff">
    <circle cx="880" cy="120" r="5"/>
    <circle cx="1060" cy="160" r="4"/>
    <circle cx="1100" cy="90" r="3.5"/>
  </g>
  <g fill="#22d3c5">
    <circle cx="980" cy="90" r="5"/>
    <circle cx="960" cy="200" r="4"/>
    <circle cx="1120" cy="220" r="3.5"/>
  </g>

  <text x="80" y="270" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="600" fill="#f2e8d5">Montaser Hussam</text>
  <text x="80" y="320" font-family="'JetBrains Mono', monospace" font-size="24" fill="#22d3c5">AI / ML Engineer — Remote worldwide</text>

  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#b9c1d1">
    <rect x="80" y="380" width="230" height="42" rx="21" fill="none" stroke="#8892a6"/>
    <text x="100" y="407">Turn latency &lt; 800ms</text>
    <rect x="330" y="380" width="180" height="42" rx="21" fill="none" stroke="#8892a6"/>
    <text x="350" y="407">Bilingual EN/AR</text>
    <rect x="530" y="380" width="290" height="42" rx="21" fill="none" stroke="#8892a6"/>
    <text x="550" y="407">Shipped on Fly.io + Pipecat</text>
  </g>

  <text x="80" y="470" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="#8892a6">Real-time voice agents, multi-agent architectures,</text>
  <text x="80" y="500" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="#8892a6">and production LLM pipelines — from microphone to deployed endpoint.</text>
</svg>
